## 🔄 **PARCOURS UTILISATEUR ET GÉNÉRATION DE DONNÉES**

### **1. PARCOURS CLIENT** 📱

#### **A. Inscription/Connexion**
- **Données générées :**
  - `users` : Création du profil client
  - `preferences` : Paramètres par défaut
  - `stats` : Initialisation des statistiques

#### **B. Recherche de Coiffeurs**
- **Données générées :**
  - `stats.profileViews` : Incrémentation des vues de profil
  - Logs de recherche (non implémenté)

#### **C. Interaction avec les Profils**
- **Données générées :**
  - `favorites` : Ajout/retrait des favoris
  - `likes` : Like des services
  - `stats.profileViews` : Vues de profil

#### **D. Réservation**
- **Données générées :**
  - `bookings` : Nouvelle réservation
  - `stats.totalBookings` : Incrémentation
  - `messages` : Messages automatiques

#### **E. Évaluation Post-Service**
- **Données générées :**
  - `reviews` : Nouvel avis
  - `rating` : Mise à jour de la note moyenne
  - `totalRatings` : Incrémentation

### **2. PARCOURS COIFFEUR** ✂️

#### **A. Inscription/Connexion**
- **Données générées :**
  - `users` : Création du profil coiffeur
  - `sirenStatus` : Statut de vérification
  - `services` : Services par défaut

#### **B. Configuration du Profil**
- **Données générées :**
  - `photo` : Upload de photo de profil
  - `gallery` : Upload d'images de galerie
  - `bio`, `specialities`, `workingHours` : Informations professionnelles

#### **C. Gestion des Services**
- **Données générées :**
  - `services` : Création/modification de services
  - `examplePhotos` : Photos des services

#### **D. Gestion des Réservations**
- **Données générées :**
  - `bookings.status` : Changements de statut
  - `stats` : Mise à jour des statistiques

## ⚠️ **PROBLÈMES IDENTIFIÉS**

### **1. INCOHÉRENCES LOGIQUES**

#### **A. Services Intégrés vs Collection Séparée**
```javascript
// PROBLÈME : Double gestion des services
userSchema.services: [ServiceSchema], // Dans User
Service: mongoose.model('Service')     // Collection séparée
```
**Impact :** Confusion dans la gestion des services

#### **B. Favoris Incohérents**
```javascript
// PROBLÈME : Deux systèmes de favoris
userSchema.favorites: [ObjectId], // Dans User
favoriteService.getFavorites()    // Service séparé
```
**Impact :** Données dupliquées et incohérentes

#### **C. Messages Basiques**
```javascript
// PROBLÈME : Modèle de message trop simple
messageSchema: {
  from: ObjectId,
  to: ObjectId,
  content: String,
  date: Date,
  read: Boolean
}
```
**Impact :** Pas de gestion des conversations, types de messages

### **2. DONNÉES MANQUANTES**

#### **A. Analytics et Tracking**
- ❌ Logs de recherche
- ❌ Historique des interactions
- ❌ Métriques de performance
- ❌ Données de géolocalisation

#### **B. Notifications**
- ❌ Collection `notifications`
- ❌ Historique des notifications
- ❌ Préférences de notification détaillées

#### **C. Paiements**
- ❌ Collection `payments`
- ❌ Historique des transactions
- ❌ Gestion des remboursements

## 🔧 **ROADMAP D'AMÉLIORATION**

### **PHASE 1 : CORRECTION DES INCOHÉRENCES** 🚨 **PRIORITÉ HAUTE**

#### **1.1 Unification des Services**
```javascript
// SOLUTION : Supprimer services intégrés dans User
// Garder uniquement la collection Service
userSchema.services: [ServiceSchema], // ❌ À SUPPRIMER
```

#### **1.2 Unification des Favoris**
```javascript
// SOLUTION : Créer une collection Favorites dédiée
const favoriteSchema = new mongoose.Schema({
  userId: { type: ObjectId, ref: 'User', required: true },
  coiffeurId: { type: ObjectId, ref: 'User', required: true },
  createdAt: { type: Date, default: Date.now }
});
```

#### **1.3 Amélioration du Système de Messages**
```javascript
// SOLUTION : Modèle de message enrichi
const messageSchema = new mongoose.Schema({
  conversationId: { type: ObjectId, ref: 'Conversation' },
  from: { type: ObjectId, ref: 'User', required: true },
  to: { type: ObjectId, ref: 'User', required: true },
  content: String,
  type: { type: String, enum: ['text', 'image', 'booking_request'] },
  read: { type: Boolean, default: false },
  readAt: Date,
  createdAt: { type: Date, default: Date.now }
});
```

### **PHASE 2 : NOUVELLES FONCTIONNALITÉS** 📈 **PRIORITÉ MOYENNE**

#### **2.1 Système de Notifications**
```javascript
const notificationSchema = new mongoose.Schema({
  userId: { type: ObjectId, ref: 'User', required: true },
  type: { type: String, enum: ['booking', 'message', 'review', 'reminder'] },
  title: String,
  message: String,
  data: Object,
  read: { type: Boolean, default: false },
  readAt: Date,
  createdAt: { type: Date, default: Date.now }
});
```

#### **2.2 Système de Paiements**
```javascript
const paymentSchema = new mongoose.Schema({
  bookingId: { type: ObjectId, ref: 'Booking', required: true },
  amount: { type: Number, required: true },
  currency: { type: String, default: 'EUR' },
  status: { type: String, enum: ['pending', 'completed', 'failed', 'refunded'] },
  method: { type: String, enum: ['card', 'paypal', 'stripe'] },
  transactionId: String,
  createdAt: { type: Date, default: Date.now }
});
```

#### **2.3 Analytics et Tracking**
```javascript
const analyticsSchema = new mongoose.Schema({
  userId: { type: ObjectId, ref: 'User' },
  action: { type: String, enum: ['search', 'view_profile', 'book', 'review'] },
  data: Object,
  ip: String,
  userAgent: String,
  createdAt: { type: Date, default: Date.now }
});
```

### **PHASE 3 : OPTIMISATIONS AVANCÉES** 🚀 **PRIORITÉ BASSE**

#### **3.1 Système de Conversations**
```javascript
const conversationSchema = new mongoose.Schema({
  participants: [{ type: ObjectId, ref: 'User' }],
  lastMessage: { type: ObjectId, ref: 'Message' },
  unreadCount: { type: Number, default: 0 },
  createdAt: { type: Date, default: Date.now },
  updatedAt: { type: Date, default: Date.now }
});
```

#### **3.2 Système de Tags et Catégories**
```javascript
const tagSchema = new mongoose.Schema({
  name: String,
  category: String,
  usageCount: { type: Number, default: 0 },
  createdAt: { type: Date, default: Date.now }
});
```

