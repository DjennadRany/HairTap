    monday: { start: String, end: String, isAvailable: Boolean },
    // ... autres jours
  },
  travelRadius: Number,
  services: [ServiceSchema], // Services intégrés
  
  // GALERIE STABLE
  gallery: [{
    url: String,
    description: String,
    isVerified: Boolean,
    _stable: Boolean,
    _addedAt: Date
  }],
  
  // SOCIAL & ENGAGEMENT
  likes: Number,
  favorites: [ObjectId], // Références vers coiffeurs favoris
  socialPosts: [{
    content: String,
    images: [String],
    hashtags: [String],
    likes: Number,
    comments: [{
      userId: ObjectId,
      content: String,
      createdAt: Date
    }]
  }],
  
  // PRÉFÉRENCES
  preferences: {
    notifications: { email: Boolean, sms: Boolean, push: Boolean },
    language: "fr" | "en",
    theme: "light" | "dark",
    privacy: { showPhone: Boolean, showAddress: Boolean }
  },
  
  // STATISTIQUES
  stats: {
    totalBookings: Number,
    completedBookings: Number,
    cancelledBookings: Number,
    averageRating: Number,
    profileViews: Number
  },
  
  // SÉCURITÉ
  isBlocked: Boolean,
  blockedUsers: [ObjectId],
  
  // TIMESTAMPS
  createdAt: Date,
  updatedAt: Date
}
