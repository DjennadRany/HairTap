### **1. MODÈLES DE DONNÉES EXISTANTS**

#### **Collection `users`** ✅ **FONCTIONNEL**
```javascript
{
  _id: ObjectId,
  // INFORMATIONS DE BASE
  name: String,
  email: String,
  password: String (hashed),
  role: "user" | "admin" | "coiffeur",
  googleId: String,
  
  // PROFIL PUBLIC
  photo: String, // URL stable avec protection
  _photoChanged: Boolean, // Flag de stabilité
  bio: String,
  phone: String,
  address: {
    street: String,
    city: String,
    postalCode: String,
    coordinates: { lat: Number, lng: Number }
  },
  
